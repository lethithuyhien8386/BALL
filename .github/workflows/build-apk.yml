name: Build and verify Bubble Pilot Astra v0.7 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install compile SDK 35 and Build Tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests for pixel detection and trajectory occlusion, wall rebounds and repeated shots
        run: bash tests/test.sh

      - name: Assemble signed DEBUG APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK is real, signed, aligned and has classes
        run: bash scripts/verify-apk.sh

      - name: Upload installable APK and SHA256 report
        uses: actions/upload-artifact@v4
        with:
          name: BubblePilot-Astra-Candidate
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/build-report.txt
          if-no-files-found: error
          retention-days: 14

  emulator-install-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        android-api: [28, 30]
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: BubblePilot-Astra-Candidate
          path: verified-apk

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Confirm installer accepts APK and app starts on Android ${{ matrix.android-api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.android-api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install -r verified-apk/app-debug.apk
            adb shell pm path com.example.bubblepilot | grep -q 'base.apk'
            adb shell am start -W -n com.example.bubblepilot/.MainActivity
            sleep 3
            adb shell pidof com.example.bubblepilot
            echo 'INSTALL & LAUNCH PASS: Bubble Pilot Astra installed and started on Android.' 

  publish-verified:
    name: Publish APK only after emulator install checks succeed
    needs: [build, emulator-install-check]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch candidate APK
        uses: actions/download-artifact@v4
        with:
          name: BubblePilot-Astra-Candidate
          path: verified-apk
      - name: Confirm candidate APK and report exist
        run: |
          test -s verified-apk/app-debug.apk
          test -s verified-apk/build-report.txt
          echo 'APK passed compile, signature and Android 9/11 installation smoke tests.'
      - name: Publish install-checked APK
        uses: actions/upload-artifact@v4
        with:
          name: BubblePilot-Astra-v0.7-APK-InstallChecked
          path: |
            verified-apk/app-debug.apk
            verified-apk/build-report.txt
          if-no-files-found: error
          retention-days: 14
